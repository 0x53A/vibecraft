[package]
name = "vibecraft-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["ws"] }
chrono = "0.4.44"
notify = { version = "8.2.0", features = ["macos_fsevent"] }
rand = "0.10.0"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.19.1"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.22.0", features = ["v4"] }
futures-util = "0.3"
hostname = "0.4"
ractor = "0.15.12"
ractor_wormhole = { git = "https://github.com/0x53A/ractor-wormhole" }
libc = "0.2.183"
async-trait = "0.1"
rmcp = { version = "1.2.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.1"
tokio-util = "0.7"
tower = "0.5"
