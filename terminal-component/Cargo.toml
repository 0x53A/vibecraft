[package]
name = "vibecraft-terminal"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beamterm-renderer = "1.0.0"
vt100 = "0.16"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rust_web_component = { git = "https://github.com/0x53A/web-component-rs", version = "0.1.0" }
rust_web_component_macro = { git = "https://github.com/0x53A/web-component-rs", version = "0.1.0" }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CustomElementRegistry",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "CssStyleDeclaration",
    "KeyboardEvent",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "Blob",
    "FileReader",
    "ProgressEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "DomRectReadOnly",
    "Node",
    "Clipboard",
    "Navigator",
    "Location",
]

[profile.release]
opt-level = "s"
lto = true
